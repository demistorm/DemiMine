# Directory Configuration:
# - Volumes use relative paths (./) by default, resolved relative to this compose file
# - To change where data is stored, edit the left side of each volume mapping:
#   Example: ./data:/data  →  /mnt/nas/demimine-data:/data
# - If you change ./servers, also update DEMIMINE_HOST_SERVERS_DIR below
# - The right side (/data, /servers, etc.) must stay the same, these are fixed container paths

networks:
  demimine_internal:
    driver: bridge

services:
  manager:
    build: .
    container_name: demimine-manager
    restart: unless-stopped
    stop_grace_period: 60s
    # Change 8025 to desired host port if needed
    ports:
      - "8025:8080"
    volumes:
      - ./data:/data
      - ./servers:/servers
      - ./backups:/backups
      - ./java:/java
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TZ=America/Chicago
      # HOST_SERVERS_DIR must be an absolute path ($PWD resolves to this directory)
      # If you move ./servers elsewhere, update this path to match
      - DEMIMINE_HOST_SERVERS_DIR=$PWD/servers
      - DEMIMINE_NETWORK=demimine_demimine_internal
      - DEMIMINE_MAX_RAM_MB=5144
      - RCON_PASSWORD=demimine_secure_yesllama_991
    labels:
      - "demimine.managed=true"
      - "demimine.type=manager"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - demimine_internal
